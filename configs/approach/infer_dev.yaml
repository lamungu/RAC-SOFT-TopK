# Inference on the DEV set for "Our Approach" (target: Table 2 dev row
# MAP 0.733, R@5 0.778, M-F1 0.472, Strict-M-F1 0.472).
# inference_driver.py reads data_file as JSONL (one sample per line).
exp_name: approach_dev
model_name: bert-base-uncased
retriever_path: ./logs/en/approach/phase3_frozen_retriever/checkpoints/retriever
classifier_path: ./logs/en/approach/phase3_frozen_retriever/checkpoints/classifier
output_file_retriever: ./results/en/approach_dev.txt
output_file_classifier: ./results/en/approach_dev.json
data_file: ./data/main/English_dev.jsonl
language: en
max_length: 128
top_k: 5
meta_file: ./meta.json
num_labels: 3
score_fn: maxsim
